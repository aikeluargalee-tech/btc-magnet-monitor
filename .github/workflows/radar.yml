name: BTC Magnet Scheduled Diagnostic & Pages Deploy

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and commit data
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Data Integrity Test Suite
        run: |
          python -m unittest tests/test_engine.py

      - name: Run BTC Magnet Diagnostic Engine
        run: |
          python main.py

      - name: Commit & Push updated data/regime.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [BTC Magnet]"
          git add data/regime.json
          git diff-index --quiet HEAD || git commit -m "chore(data): update live regime scan [skip ci]"
          git push || echo "No changes to commit or push skipped"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
