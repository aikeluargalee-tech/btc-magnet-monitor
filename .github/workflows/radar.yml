name: BTC Magnet Scheduled Diagnostic & Pages Deploy

on:
  schedule:
    # 4 staggered off-peak schedules per 30m window (free public-repo redundancy vs GitHub cron drops)
    - cron: '2,32 * * * *'
    - cron: '8,38 * * * *'
    - cron: '15,45 * * * *'
    - cron: '23,53 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI / Phone
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and commit data
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check telemetry freshness (skip redundant backup schedule runs)
        id: fresh
        run: |
          python3 - <<'EOF'
          import json, datetime, os
          skip = 'false'
          if os.environ.get('GITHUB_EVENT_NAME') == 'schedule' and os.path.exists('data/regime.json'):
              try:
                  now = datetime.datetime.now(datetime.timezone.utc)
                  ts = json.load(open('data/regime.json'))['timestamp'].replace('Z', '+00:00')
                  last_dt = datetime.datetime.fromisoformat(ts)
                  age = (now - last_dt).total_seconds()
                  same_window = (now.date(), now.hour, now.minute // 30) == (last_dt.date(), last_dt.hour, last_dt.minute // 30)
                  # Never let an earlier half-hour push skip the next :02/:32 slot; skip only same-window backups or <6m duplicates
                  if age < 360 or (same_window and age < 1500):
                      skip = 'true'
              except Exception:
                  pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'skip={skip}\n')
          print(f'schedule freshness check -> skip={skip}')
          EOF
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Set up Python
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.fresh.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Data Integrity Test Suite
        if: steps.fresh.outputs.skip != 'true'
        run: |
          python -m unittest discover -s tests -v

      - name: Run BTC Magnet Diagnostic Engine
        if: steps.fresh.outputs.skip != 'true'
        run: |
          python main.py

      - name: Commit & Push updated data/regime.json
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [BTC Magnet]"
          git add data/regime.json
          git diff-index --quiet HEAD || git commit -m "chore(data): update live regime scan [skip ci]"
          git pull --rebase || true
          git push || echo "No changes to commit or push skipped"

      - name: Setup Pages
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.fresh.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' && needs.build.outputs.skip != 'true' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
