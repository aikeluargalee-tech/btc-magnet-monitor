name: Build Android APK (Capacitor Mobile App)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab only

# Least privilege: this job only needs to read the repository (it never pushes or deploys).
permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Build Web Cockpit & Telemetry
        env:
          BTC_MAGNET_ADMOB_APP_ID: ${{ secrets.BTC_MAGNET_ADMOB_APP_ID }}
          BTC_MAGNET_ADMOB_BANNER_ID: ${{ secrets.BTC_MAGNET_ADMOB_BANNER_ID }}
          BTC_MAGNET_ADMOB_NATIVE_ID: ${{ secrets.BTC_MAGNET_ADMOB_NATIVE_ID }}
          BTC_MAGNET_ADMOB_TESTING: ${{ secrets.BTC_MAGNET_ADMOB_TESTING }}
        run: |
          python main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build bundled Tailwind CSS (no CDN inside the app)
        run: |
          npx tailwindcss -c tailwind.config.js -i assets/tailwind-input.css -o dist/tailwind.css --minify

      - name: Bundle fonts and strip every CDN reference (build fails if any remain)
        run: |
          python scripts/bundle_offline_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Third-party action pinned to an exact commit (v4) so a moved tag cannot inject code into our build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Initialize & Sync Capacitor Android
        env:
          BTC_MAGNET_ADMOB_APP_ID: ${{ secrets.BTC_MAGNET_ADMOB_APP_ID }}
          BTC_MAGNET_VERSION_CODE: ${{ vars.BTC_MAGNET_VERSION_CODE || '9' }}
          BTC_MAGNET_VERSION_NAME: ${{ vars.BTC_MAGNET_VERSION_NAME || '1.0.9' }}
        run: |
          export ADMOB_APP_ID="${BTC_MAGNET_ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          python3 -c 'import json, os; p="capacitor.config.json"; cfg=json.load(open(p, encoding="utf-8")); cfg.setdefault("plugins", {}).setdefault("AdMob", {})["appId"]=os.environ["ADMOB_APP_ID"]; json.dump(cfg, open(p, "w", encoding="utf-8"), indent=2); open(p, "a", encoding="utf-8").write("\n")'
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          python scripts/generate_android_assets.py
          python scripts/configure_android_native.py

      - name: Inject Google AdMob App ID into AndroidManifest.xml
        env:
          BTC_MAGNET_ADMOB_APP_ID: ${{ secrets.BTC_MAGNET_ADMOB_APP_ID }}
        run: |
          export ADMOB_APP_ID="${BTC_MAGNET_ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i "/<\/application>/i \\        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"${ADMOB_APP_ID}\"/>" "$MANIFEST"
          else
            python3 -c 'import os, re; p="android/app/src/main/AndroidManifest.xml"; txt=open(p, encoding="utf-8").read(); aid=os.environ["ADMOB_APP_ID"]; open(p, "w", encoding="utf-8").write(re.sub(r"(<meta-data\s+android:name=\"com\.google\.android\.gms\.ads\.APPLICATION_ID\"\s+android:value=\")[^\"]*(\")", rf"\g<1>{aid}\g<2>", txt))'
          fi

      - name: Prepare Release Upload Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 -d > android/app/upload-keystore.p12
            keytool -list -keystore android/app/upload-keystore.p12 -storepass "$ANDROID_KEYSTORE_PASSWORD"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; generating ephemeral keystore."
            keytool -genkeypair -v -keystore android/app/upload-keystore.p12 -storetype PKCS12 \
              -alias btcmagnet -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "btcmagnet-fallback-pass" -keypass "btcmagnet-fallback-pass" \
              -dname "CN=BTC Magnet Monitor, OU=Mobile, O=Aikeluargalee Tech, C=SG"
          fi

      - name: Build Android Debug & Signed Release APK + Play Store AAB with Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'btcmagnet-fallback-pass' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'btcmagnet' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'btcmagnet-fallback-pass' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Verify the built APK is self-contained (no CDN, bundled CSS and fonts present)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          for f in index.html entry.html text.html app.html regimes.html privacy.html; do
            if unzip -p "$APK" "assets/public/$f" | grep -qiE "(src|href)[[:space:]]*=[[:space:]]*[\"']?https?://(cdn\.tailwindcss\.com|fonts\.googleapis\.com|fonts\.gstatic\.com)"; then
              echo "::error::$f inside the APK still loads a CDN resource"; exit 1
            fi
          done
          unzip -l "$APK" | grep -q "assets/public/tailwind.css" || { echo "::error::tailwind.css missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/i18n.js" || { echo "::error::i18n.js missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/fonts/inter-latin-wght-normal.woff2" || { echo "::error::Inter font missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/assets/media/entry-hero.mp4" || { echo "::error::entry-hero.mp4 missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/assets/media/entry-badger.mp4" || { echo "::error::entry-badger.mp4 missing from APK"; exit 1; }
          unzip -p "$APK" assets/public/entry.html | grep -q "entry-hero-video" || { echo "::error::entry.html entry-hero-video missing from APK"; exit 1; }
          unzip -p "$APK" assets/public/entry.html | grep -q "entry-badger-video" || { echo "::error::entry.html entry-badger-video missing from APK"; exit 1; }
          unzip -p "$APK" assets/public/entry.html | grep -q "verdict1-showcase" || { echo "::error::entry.html verdict1-showcase missing from APK"; exit 1; }
          unzip -p "$APK" assets/public/index.html | grep -q "data-age-banner" || { echo "::error::data-age banner missing from APK"; exit 1; }
          unzip -p "$APK" assets/public/text.html | grep -q "terminal-wrapper" || { echo "::error::text.html terminal-wrapper missing from APK"; exit 1; }
          unzip -p "$APK" assets/public/app.html | grep -q "terminal-wrapper" || { echo "::error::app.html terminal-wrapper missing from APK"; exit 1; }
          if unzip -l "$APK" | grep -q "res/drawable-anydpi-v24/ic_launcher_foreground.xml"; then
            echo "::error::Default Capacitor ic_launcher_foreground.xml was not removed"; exit 1
          fi
          unzip -l "$APK" | grep -q "res/mipmap-anydpi-v26/ic_launcher.xml" || { echo "::error::mipmap-anydpi-v26/ic_launcher.xml missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "res/mipmap-xxxhdpi-v4/ic_launcher.png" || { echo "::error::mipmap-xxxhdpi-v4/ic_launcher.png missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png" || { echo "::error::mipmap-xxxhdpi-v4/ic_launcher_foreground.png missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "res/layout/native_ad_card.xml" || { echo "::error::res/layout/native_ad_card.xml missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "res/drawable/native_ad_card_bg.xml" || { echo "::error::res/drawable/native_ad_card_bg.xml missing from APK"; exit 1; }
          unzip -p "$APK" "classes*.dex" | grep -aq "Lcom/aikeluargalee/btcmagnet/MagnetNativeAdPlugin;" || { echo "::error::MagnetNativeAdPlugin missing from APK DEX"; exit 1; }
          echo "APK self-containment, custom launcher icon, and NativeAd checks passed."
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          REL_APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$AAB" || { echo "::error::Release AAB missing at $AAB"; exit 1; }
          test -f "$REL_APK" || { echo "::error::Release APK missing at $REL_APK"; exit 1; }
          jarsigner -verify "$AAB"
          unzip -l "$AAB" | grep -q "base/res/layout/native_ad_card.xml" || { echo "::error::native_ad_card.xml missing from AAB"; exit 1; }
          sha256sum "$APK" "$REL_APK" "$AAB"

      - name: Upload Play Store Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-magnet-monitor-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-magnet-monitor-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-magnet-monitor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
