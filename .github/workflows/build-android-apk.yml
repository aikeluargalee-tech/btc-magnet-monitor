name: Build Android APK (Capacitor Mobile App)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab only

# Least privilege: this job only needs to read the repository (it never pushes or deploys).
permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Build Web Cockpit & Telemetry
        run: |
          python main.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build bundled Tailwind CSS (no CDN inside the app)
        run: |
          npx tailwindcss -c tailwind.config.js -i assets/tailwind-input.css -o dist/tailwind.css --minify

      - name: Bundle fonts and strip every CDN reference (build fails if any remain)
        run: |
          python scripts/bundle_offline_assets.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Third-party action pinned to an exact commit (v4) so a moved tag cannot inject code into our build.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          python scripts/generate_android_assets.py
          python scripts/configure_android_native.py

      - name: Inject Google AdMob Test App ID into AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Ensure AdMob App ID meta-data is present inside <application>
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' "$MANIFEST"
          fi

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify the built APK is self-contained (no CDN, bundled CSS and fonts present)
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          for f in index.html text.html app.html regimes.html privacy.html; do
            if unzip -p "$APK" "assets/public/$f" | grep -qiE "(src|href)[[:space:]]*=[[:space:]]*[\"']?https?://(cdn\.tailwindcss\.com|fonts\.googleapis\.com|fonts\.gstatic\.com)"; then
              echo "::error::$f inside the APK still loads a CDN resource"; exit 1
            fi
          done
          unzip -l "$APK" | grep -q "assets/public/tailwind.css" || { echo "::error::tailwind.css missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/fonts/inter-latin-wght-normal.woff2" || { echo "::error::Inter font missing from APK"; exit 1; }
          unzip -p "$APK" assets/public/index.html | grep -q "data-age-banner" || { echo "::error::data-age banner missing from APK"; exit 1; }
          unzip -p "$APK" assets/public/text.html | grep -q "terminal-wrapper" || { echo "::error::text.html terminal-wrapper missing from APK"; exit 1; }
          unzip -p "$APK" assets/public/app.html | grep -q "terminal-wrapper" || { echo "::error::app.html terminal-wrapper missing from APK"; exit 1; }
          if unzip -l "$APK" | grep -q "res/drawable-anydpi-v24/ic_launcher_foreground.xml"; then
            echo "::error::Default Capacitor ic_launcher_foreground.xml was not removed"; exit 1
          fi
          unzip -l "$APK" | grep -q "res/mipmap-anydpi-v26/ic_launcher.xml" || { echo "::error::mipmap-anydpi-v26/ic_launcher.xml missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "res/mipmap-xxxhdpi-v4/ic_launcher.png" || { echo "::error::mipmap-xxxhdpi-v4/ic_launcher.png missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png" || { echo "::error::mipmap-xxxhdpi-v4/ic_launcher_foreground.png missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "res/layout/native_ad_card.xml" || { echo "::error::res/layout/native_ad_card.xml missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "res/drawable/native_ad_card_bg.xml" || { echo "::error::res/drawable/native_ad_card_bg.xml missing from APK"; exit 1; }
          unzip -p "$APK" "classes*.dex" | grep -aq "Lcom/aikeluargalee/btcmagnet/MagnetNativeAdPlugin;" || { echo "::error::MagnetNativeAdPlugin missing from APK DEX"; exit 1; }
          echo "APK self-containment, custom launcher icon, and NativeAd checks passed."
          sha256sum "$APK"

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-magnet-monitor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
