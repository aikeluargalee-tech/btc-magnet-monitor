<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTC Magnet</title>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #07090d;
      --card: #0f1218;
      --amber: #f5a623;
      --cyan: #00e5d0;
      --text: #f0f2f5;
      --muted: #7a8290;
      --border: #1e242e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 16px;
    }
    .app { width: 100%; max-width: 400px; }
    .header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #00e5d0, #f5a623);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: #000;
    }
    .logo-text { font-weight: 700; font-size: 18px; letter-spacing: 1px; }
    .logo-sub { font-size: 11px; color: var(--amber); letter-spacing: 2px; margin-top: 2px; }
    .terminal-badge {
      margin-left: auto; font-size: 10px; border: 1px solid var(--amber);
      color: var(--amber); padding: 4px 8px; border-radius: 4px;
    }
    .price-section { margin-bottom: 20px; }
    .price-label { font-size: 11px; color: var(--cyan); letter-spacing: 1px; margin-bottom: 4px; }
    .price { font-size: 48px; font-weight: 700; letter-spacing: -1px; }
    .change { color: #3dd68c; font-size: 14px; margin-top: 4px; }
    .change.neg { color: #ff6b6b; }
    .chart-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .chart-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 12px; }
    .chart-area { position: relative; height: 180px; background: #0a0c10; border-radius: 8px; overflow: hidden; }
    .y-labels {
      position: absolute; left: 8px; top: 0; bottom: 0; width: 48px;
      font-size: 10px; color: var(--muted); display: flex; flex-direction: column;
      justify-content: space-between; padding: 8px 0;
    }
    .magnet-band { position: absolute; left: 56px; right: 70px; height: 4px; border-radius: 2px; }
    .magnet-band.cyan { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
    .magnet-band.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
    .band-label { position: absolute; right: 8px; font-size: 10px; font-weight: 600; line-height: 1.2; }
    .price-line { position: absolute; left: 56px; right: 12px; bottom: 28px; height: 70px; }
    .price-line svg { width: 100%; height: 100%; }
    .x-labels {
      position: absolute; bottom: 6px; left: 56px; right: 12px;
      display: flex; justify-content: space-between; font-size: 9px; color: var(--muted);
    }
    .status-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 16px;
    }
    .status-title { font-size: 11px; color: var(--amber); letter-spacing: 1px; margin-bottom: 10px; }
    .status-card p { line-height: 1.6; font-size: 14px; }
    .status-card .wait { color: var(--amber); font-weight: 600; margin-top: 10px; }
    button {
      width: 100%; background: transparent; color: var(--amber);
      border: 1px solid var(--amber); padding: 14px; border-radius: 10px;
      font-size: 14px; font-weight: 600; letter-spacing: 1px; cursor: pointer;
    }
    button:active { opacity: 0.75; }
    .loading { opacity: 0.6; }
    #shareCard { position: absolute; left: -9999px; top: 0; width: 400px; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="header">
      <div class="logo-icon">M</div>
      <div>
        <div class="logo-text">BTC MAGNET</div>
        <div class="logo-sub">TERMINAL</div>
      </div>
      <div class="terminal-badge">v1.0</div>
    </div>

    <div class="price-section">
      <div class="price-label">BITCOIN PRICE (USD)</div>
      <div class="price" id="price">Loading...</div>
      <div class="change" id="change">—</div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <span>PRICE MAGNET MAP</span>
        <span id="updated">Live</span>
      </div>
      <div class="chart-area" id="chartArea">
        <div class="y-labels" id="yLabels"></div>
        <div id="bands"></div>
        <div class="price-line">
          <svg viewBox="0 0 280 70" preserveAspectRatio="none" id="priceSvg">
            <polyline fill="none" stroke="#f5a623" stroke-width="1.8" id="pricePath"/>
          </svg>
        </div>
        <div class="x-labels">
          <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
        </div>
      </div>
    </div>

    <div class="status-card" id="statusCard">
      <div class="status-title">>_ TERMINAL READOUT</div>
      <p id="statusText">Loading magnet data...</p>
      <p class="wait" id="statusWait">—</p>
    </div>

    <button onclick="shareCard()">SHARE MAGNET CARD</button>
  </div>

  <div id="shareCard"></div>

  <script>
    const BINANCE = 'https://api.binance.com/api/v3/ticker/24hr?symbol=BTCUSDT';
    const LIQMAP = 'https://edgeornot.com/api/liqmap/btc?days=1&ex=all';

    let currentPrice = 0;
    let magnetAbove = null;
    let magnetBelow = null;

    async function fetchPrice() {
      try {
        const res = await fetch(BINANCE);
        const data = await res.json();
        currentPrice = parseFloat(data.lastPrice);
        const change = parseFloat(data.priceChangePercent);
        document.getElementById('price').textContent = '$' + currentPrice.toLocaleString(undefined, {maximumFractionDigits: 0});
        const chEl = document.getElementById('change');
        chEl.textContent = (change >= 0 ? '▲ +' : '▼ ') + Math.abs(change).toFixed(2) + '% (24h)';
        chEl.className = 'change' + (change < 0 ? ' neg' : '');
        document.getElementById('updated').textContent = 'Live · ' + new Date().toLocaleTimeString();
        return currentPrice;
      } catch (e) {
        console.error('Price fetch failed', e);
        return null;
      }
    }

    async function fetchMagnets() {
      try {
        const res = await fetch(LIQMAP);
        const data = await res.json();
        if (data && data.levels) {
          const levels = data.levels || [];
          const above = levels.filter(l => l.price > currentPrice).sort((a,b) => a.price - b.price)[0];
          const below = levels.filter(l => l.price < currentPrice).sort((a,b) => b.price - a.price)[0];
          magnetAbove = above ? above.price : currentPrice * 1.03;
          magnetBelow = below ? below.price : currentPrice * 0.97;
        } else {
          magnetAbove = currentPrice * 1.025;
          magnetBelow = currentPrice * 0.975;
        }
        renderMagnets();
        evaluateStatus();
      } catch (e) {
        console.error('Magnet fetch failed', e);
        magnetAbove = currentPrice * 1.025;
        magnetBelow = currentPrice * 0.975;
        renderMagnets();
        evaluateStatus();
      }
    }

    function renderMagnets() {
      if (!currentPrice) return;
      const min = currentPrice * 0.96;
      const max = currentPrice * 1.04;
      const range = max - min;
      const yLabels = document.getElementById('yLabels');
      yLabels.innerHTML = [max, currentPrice * 1.02, currentPrice, currentPrice * 0.98, min]
        .map(p => `<span>${Math.round(p).toLocaleString()}</span>`).join('');

      const bands = document.getElementById('bands');
      bands.innerHTML = '';
      if (magnetAbove) {
        const top = ((max - magnetAbove) / range) * 140 + 10;
        bands.innerHTML += `<div class="magnet-band cyan" style="top:${top}px"></div>
          <div class="band-label" style="top:${top-6}px;color:var(--cyan)">${Math.round(magnetAbove).toLocaleString()}<br>MAGNET</div>`;
      }
      if (magnetBelow) {
        const top = ((max - magnetBelow) / range) * 140 + 10;
        bands.innerHTML += `<div class="magnet-band amber" style="top:${top}px"></div>
          <div class="band-label" style="top:${top-6}px;color:var(--amber)">${Math.round(magnetBelow).toLocaleString()}<br>SUPPORT</div>`;
      }
    }

    function evaluateStatus() {
      const distAbove = magnetAbove ? (magnetAbove - currentPrice) / currentPrice : 1;
      const hasClearMagnet = distAbove < 0.03 && distAbove > 0.005;
      const statusText = document.getElementById('statusText');
      const statusWait = document.getElementById('statusWait');

      if (hasClearMagnet) {
        statusText.innerHTML = `Strong magnet above at $${Math.round(magnetAbove).toLocaleString()}.<br>Short liquidations clustered.<br>Spot flow context positive.`;
        statusWait.textContent = 'Watch for sweep.';
      } else {
        statusText.innerHTML = `Magnet levels present but conditions incomplete.<br>No high-conviction setup.`;
        statusWait.textContent = 'No clear edge — wait.';
      }
    }

    async function shareCard() {
      const card = document.getElementById('shareCard');
      card.innerHTML = document.getElementById('app').innerHTML;
      card.style.position = 'fixed';
      card.style.left = '0';
      card.style.top = '0';
      card.style.zIndex = '-1';
      try {
        const canvas = await html2canvas(card, {backgroundColor: '#07090d', scale: 2});
        const link = document.createElement('a');
        link.download = 'btc-magnet-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (e) {
        alert('Share card generated. Long-press or screenshot to save.\n\n' + document.getElementById('statusText').innerText);
      }
      card.style.position = 'absolute';
      card.style.left = '-9999px';
    }

    async function updateAll() {
      document.body.classList.add('loading');
      await fetchPrice();
      await fetchMagnets();
      document.body.classList.remove('loading');
    }

    updateAll();
    setInterval(updateAll, 60000);
  </script>
</body>
</html>
